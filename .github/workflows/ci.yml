name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run verify
      - run: npm run check:bundle
      - run: npm audit --audit-level=high

  wordpress-integration:
    name: WordPress integration
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate harness configuration
        run: npm run test:wordpress -- --dry-run
      - name: Run checkpoint integration
        run: npm run test:checkpoint
      - name: Run disposable WordPress import
        run: npm run test:wordpress
      - name: Upload harness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-harness-diagnostics
          path: /tmp/blockify-wordpress-harness/
          if-no-files-found: ignore
