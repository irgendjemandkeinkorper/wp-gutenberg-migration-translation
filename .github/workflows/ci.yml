name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run verify
      - run: npm run check:bundle
      - run: npm audit --audit-level=high

  template-match-e2e:
    name: Template-match E2E
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run template-match E2E suite
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  wordpress-integration:
    name: WordPress integration
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate harness configuration
        run: npm run test:wordpress -- --dry-run
      - name: Run checkpoint integration
        run: npm run test:checkpoint
      - name: Run disposable WordPress import
        run: npm run test:wordpress
      - name: Upload harness diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wordpress-harness-diagnostics
          path: /tmp/blockify-wordpress-harness/
          if-no-files-found: ignore
